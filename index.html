<style>
  html,body{margin:0;padding:0}
  body{overscroll-behavior:none}
  ::-webkit-scrollbar{display:none}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400}
  .seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:10px}
  .seg>i{background:#35343a;display:block}
  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  details[open] .chev{transform:rotate(180deg)}
  .dz-active{border-color:#a078ff!important;background:rgba(160,120,255,.08)!important}
  @media (max-width:1023px){
    #sidebar{transform:translateX(-100%);transition:transform .2s}
    #sidebar.open{transform:none}
    #shell{padding-left:0!important}
    #topbar{left:0!important}
  }
</style>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">

<aside id="sidebar" class="fixed left-0 top-0 h-full w-72 bg-surface-container-lowest z-50 flex flex-col justify-between overflow-y-auto"></aside>
<div id="scrim" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden"></div>

<div id="shell" class="lg:pl-72 flex flex-col min-h-screen">
  <header id="topbar" class="fixed top-0 left-72 right-0 z-30 bg-surface/90 backdrop-blur-xl">
    <div class="h-16 w-full px-gutter flex items-center justify-between gap-space-md">
      <button id="menuBtn" aria-label="Open menu" class="lg:hidden text-on-surface-variant"><span class="material-symbols-outlined">menu</span></button>
      <span id="crumb" class="hidden sm:block font-headline-sm text-headline-sm whitespace-nowrap">Overview</span>
      <div class="flex-1 max-w-lg">
        <label class="flex items-center px-space-sm py-1.5 bg-surface-container-low text-on-surface-variant gap-space-sm focus-within:bg-surface-container">
          <span class="material-symbols-outlined text-outline text-base">search</span>
          <input id="search" class="w-full bg-transparent font-label-md text-label-md text-on-surface placeholder:text-outline focus:outline-none" placeholder="Search history" type="text"/>
        </label>
      </div>
      <div class="flex items-center gap-space-md">
        
        </div>
    </div>
  </header>

  <main id="view" class="w-full pt-16 flex-1 bg-background"></main>

  
</div>

<script src="app.js"></script>
</body>
</html>
